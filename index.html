<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1413">
<meta name="description" content="دافي | ويطيب المقام. Dafi Home: furniture, art, lighting and accessories from Baghdad. The Art of Lingering.">
<title>Dafi Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout concept: one room you can relight. A sticky hero "camera" pushes into the room on scroll,
   then the four collections travel on a shallow arc. Single deliberate look: the light dial is the theme. */
@font-face { font-family: "PP Editorial New"; src: url(assets/fonts/pp-editorial-new-regular.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: "PP Editorial New"; src: url(assets/fonts/pp-editorial-new-thinitalic.woff2) format("woff2"); font-weight: 100 500; font-style: italic; font-display: swap; }
@font-face { font-family: "PP Editorial New"; src: url(assets/fonts/pp-editorial-new-heavyitalic.woff2) format("woff2"); font-weight: 600 900; font-style: italic; font-display: swap; }
@font-face { font-family: "Kufam"; src: url(assets/fonts/kufam-variable.woff2) format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap; }

:root {
  /* brand constants (Dafi Home design system) */
  --teal:#147581; --maroon:#682D3F; --heritage-yellow:#D4A017; --ivory:#F4EFE9; --walnut:#302523; --rose:#B88E8D; --stone:#DDD5D0; --photo-plate:#ECE8E3;
  /* atmosphere — day keyframe; the lighting engine rewrites these continuously */
  --ground:#F4EFE9; --ground-raised:#FBF8F4; --ground-sunk:#DDD5D0; --ink:#302523; --ink-muted:#65524D;
  --hairline:rgba(48,37,35,.16); --line-control:#8A7A74; --accent:#147581; --on-accent:#FBF8F4; --menu-ground:#147581; --on-menu:#F4EFE9;
  --focus-ring:#147581; --lamp:#E8B23A; --lamp-glow:rgba(212,160,23,.16); --sunlight:rgba(255,240,214,.6); --shade:rgba(48,37,35,.2); --glass:rgba(251,248,244,.56);
  --notice:#7A5A08; --notice-soft:#F6E7BC; --danger:#9E2F2A;
  --shadow-object:0 24px 40px -18px rgba(48,37,35,.35);
  /* light-driven scalars */
  --light:0; --room-bright:1; --room-warm:0; --sun-op:1; --dusk-op:0; --night-op:0; --glow-op:.1; --photo-bright:1; --glow-r:40%; --shadow-blur:18px; --halo:0;
  /* type */
  --font-ar-display:"Kufam","IBM Plex Sans Arabic","Geeza Pro",sans-serif;
  --font-ar-text:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",sans-serif;
  --font-en-display:"PP Editorial New","Iowan Old Style",Georgia,serif;
  --font-en-text:"PP Editorial New","Iowan Old Style",Georgia,serif;
  /* scales */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:72px; --space-9:120px;
  --radius-sm:4px; --radius-md:14px; --radius-lg:32px; --radius-pill:999px;
  --touch-min:48px; --dur-quick:180ms; --dur-blink:260ms; --dur-reveal:720ms; --dur-atmosphere:1400ms;
  --ease-arrive:cubic-bezier(.22,.8,.24,1); --ease-light:cubic-bezier(.6,0,.4,1);
  --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* image boxes are arches: a full semicircle on tall images, a softer elliptical crown on wide ones */
.card, .mat__face, .matdetail__swatch, .feat img, .stage__visual, .viewing__photo, .ba, .pairing__a, .beginnings li i, .founder img {
  border-radius: 50% 50% var(--radius-md) var(--radius-md) / 34% 34% var(--radius-md) var(--radius-md) !important; }
.card, .founder img, .beginnings li i { border-radius: 50% 50% var(--radius-md) var(--radius-md) / 30% 30% var(--radius-md) var(--radius-md) !important; }
.ba__tag { top: 34% !important; }
.mat__pair { top: 26% !important; }
/* second-language lines take their own direction, so English full stops sit at the end on the right and Arabic ones on the left */
.sub-en, .intro__en, .stage__text .en-title, .closing small, .founder figcaption small, .run__cap small, .foot span, .pv-sub, [data-k$=".sub"], .feat figcaption { unicode-bidi: plaintext; }
html[dir="rtl"] .sub-en, html[dir="rtl"] .stage__text .en-title, html[dir="rtl"] .closing small, html[dir="rtl"] .founder figcaption small, html[dir="rtl"] .feat figcaption { text-align: right; }
html[dir="ltr"] .sub-en, html[dir="ltr"] .stage__text .en-title, html[dir="ltr"] .closing small, html[dir="ltr"] .founder figcaption small, html[dir="ltr"] .feat figcaption { text-align: left; }
.viewing .sub-en { text-align: center !important; }
html, body { overflow-x: clip; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 17px/30px var(--font-ar-text); -webkit-font-smoothing: antialiased; }
html[lang="en"] body { font: 400 16px/26px var(--font-en-text); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.halo { text-shadow: 0 0 calc(var(--halo) * 14px) color-mix(in srgb, var(--ground) calc(var(--halo) * 90%), transparent); }

/* ---------- top bar ---------- */
.bar { position: fixed; z-index: 40; top: 0; inset-inline: 0; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gutter-r) 10px var(--gutter-l); pointer-events: none; }
.bar > * { pointer-events: auto; }
.bar__logo { display: block; height: 52px; opacity: 0; transform: translateY(-6px); transition: opacity 400ms, transform 400ms var(--ease-arrive); }
.bar__logo img { height: 52px; width: auto; display: block; }
.bar.is-scrolled .bar__logo { opacity: 1; transform: none; }
.bar__tools { display: flex; gap: var(--space-2); }
.chip { min-height: var(--touch-min); min-width: var(--touch-min); padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 1px solid var(--hairline);
  background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--space-2); font: 500 14px/1 var(--font-ar-text); }
.menu-mark { width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 1px solid var(--hairline); background: var(--glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: grid; place-items: center; cursor: pointer;
  transition: transform var(--dur-quick) var(--ease-arrive); -webkit-tap-highlight-color: transparent; }
.menu-mark img { width: 30px; height: auto; display: block; transition: transform 500ms var(--ease-arrive), filter 400ms; }
.menu-mark:hover img { transform: rotate(90deg); }
.menu-mark:active { transform: scale(.94); }
html.is-night .menu-mark img { filter: brightness(1.9) saturate(.85); }
.chip .en { font: 600 11px/1 var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; }
.chip svg { display: block; }
.progress { position: fixed; z-index: 41; top: 0; inset-inline-start: 0; height: 2px; width: 100%; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(90deg, var(--teal), var(--maroon) 55%, var(--heritage-yellow)); }
html[dir="rtl"] .progress { transform-origin: 100% 50%; }

/* ---------- the room (hero) ---------- */
.arrival { position: relative; height: 175svh; }
.room { position: sticky; top: 0; height: 100svh; min-height: 640px; overflow: hidden; background: var(--ground); }
.layer { position: absolute; inset: 0; will-change: transform; }
.wall { background:
  radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--ground-raised) 70%, transparent), transparent 70%), var(--ground); }
.floor { top: auto; height: 30%; background: linear-gradient(to bottom, var(--ground-sunk), color-mix(in srgb, var(--ground-sunk) 80%, var(--walnut))); }
.floor::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: var(--hairline); }
/* sunlight through a window: a raked beam with mullion shadows */
.sun { opacity: var(--sun-op); pointer-events: none; }
.sun__beam { position: absolute; top: -12%; inset-inline-end: -6%; width: 62%; height: 112%; transform: skewX(-16deg);
  background: linear-gradient(to bottom, var(--sunlight), color-mix(in srgb, var(--sunlight) 40%, transparent) 70%, transparent);
  filter: blur(6px); mix-blend-mode: screen; }
.sun__panes { position: absolute; top: 16%; inset-inline-end: 6%; width: min(48%, 420px); height: 46%; transform: skewX(-16deg);
  background:
    linear-gradient(90deg, transparent 47.5%, var(--shade) 47.5% 52.5%, transparent 52.5%),
    linear-gradient(0deg, transparent 58%, var(--shade) 58% 62%, transparent 62%),
    linear-gradient(to bottom, var(--sunlight), color-mix(in srgb, var(--sunlight) 55%, transparent));
  filter: blur(calc(var(--shadow-blur) * .1)); mix-blend-mode: screen; }
html[dir="ltr"] .sun__beam, html[dir="ltr"] .sun__panes { transform: skewX(16deg); }
.vignette { background: radial-gradient(130% 95% at 50% 42%, transparent 40%, var(--shade)); pointer-events: none; }

.objects { filter: brightness(var(--room-bright)) sepia(var(--room-warm)); }
/* artwork on the wall */
.art { position: absolute; top: 33%; inset-inline-start: 8%; width: min(30vw, 190px); aspect-ratio: 4 / 5; padding: 12px; background: var(--ivory);
  box-shadow: 0 14px 26px -16px rgba(0,0,0,.55); border: 1px solid var(--hairline); transition: transform 600ms var(--ease-arrive); }
.art__canvas { position: relative; width: 100%; height: 100%; overflow: hidden; background: #EDE4D8; }
.art__canvas i { position: absolute; display: block; }
.art__canvas .a1 { inset: 0 38% 30% 0; background: var(--teal); border-end-end-radius: 999px; }
.art__canvas .a2 { inset: 42% 0 0 34%; background: var(--maroon); border-start-start-radius: 999px; }
.art__canvas .a3 { width: 26%; aspect-ratio: 1; border-radius: 50%; top: 14%; inset-inline-end: 12%; background: var(--heritage-yellow); }
.art__spot { position: absolute; inset: -40% -30%; background: radial-gradient(closest-side, rgba(255,214,140,calc(var(--light) * .5)), transparent); pointer-events: none; mix-blend-mode: screen; }
.art:hover, .art:focus-visible { transform: perspective(600px) rotateY(-8deg) rotateX(2deg); }
/* the photograph: one real Dafi interior, relit by the dial */
.photo-zone { top: auto; height: 74%; container-type: size; overflow: hidden; transform-origin: 71% 30%; }
.frame { position: absolute; --fw: max(100cqw, 222.2cqh); --fh: calc(var(--fw) / 2.222); width: var(--fw); height: var(--fh);
  left: calc((100cqw - var(--fw)) * .86); top: calc((100cqh - var(--fh)) * .5); }
.photo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover;
  filter: brightness(var(--photo-bright)) saturate(calc(1 + var(--light) * .12)) sepia(calc(var(--room-warm) * .5)); }
.ph { position: absolute; inset: 0; pointer-events: none; }
.ph-sun { background: linear-gradient(112deg, rgba(255,246,226,0) 12%, rgba(255,246,226,.42) 30%, rgba(255,246,226,0) 48%),
  linear-gradient(112deg, rgba(255,246,226,0) 52%, rgba(255,246,226,.22) 60%, rgba(255,246,226,0) 68%); mix-blend-mode: soft-light; opacity: var(--sun-op); }
.ph-dusk { background: linear-gradient(180deg, rgba(255,160,70,.55), rgba(150,50,60,.45)); mix-blend-mode: soft-light; opacity: var(--dusk-op); }
.ph-night { --lb: 0%; background: radial-gradient(circle at 71% 18%, rgba(24,10,12,0) 0 calc(9% + var(--lb)), rgba(24,10,12,.5) calc(24% + var(--lb)), rgba(16,8,9,.9) calc(54% + var(--lb))); mix-blend-mode: multiply; opacity: var(--night-op); }
.room.lamp-bright .ph-night { --lb: 12%; }
.ph-glow { inset: auto; left: 71%; top: 20%; width: 46%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,214,140,.8), rgba(255,170,80,.3) 30%, rgba(255,150,60,0) 62%); mix-blend-mode: screen;
  opacity: var(--glow-op); transform: scale(var(--glow-scale, 1)); transition: transform 600ms var(--ease-arrive), opacity 600ms; }
.room.lamp-bright .ph-glow { --glow-scale: 1.3; opacity: calc(var(--glow-op) + .3); }
/* lamp on: the shade glows and warm light floods the wall around it — the room never turns to daylight */
.ph-bloom { pointer-events: none; mix-blend-mode: screen; opacity: 0; transition: opacity 900ms var(--ease-light);
  background: radial-gradient(circle at 71% 24%, rgba(255,190,100,.38) 0 10%, rgba(255,165,70,.3) 22%, rgba(255,140,50,.12) 40%, rgba(255,130,40,0) 62%); }
.ph-off { pointer-events: none; mix-blend-mode: multiply; opacity: 0; transition: opacity 900ms var(--ease-light);
  background: radial-gradient(circle at 71% 22%, rgba(60,30,20,.55), rgba(14,7,6,.92) 55%); }
.room.lamp-on .ph-bloom { opacity: 1; }
.room.is-flickering .ph-bloom, .room.is-flickering .ph-off, .room.is-flickering .ph-glow { transition: none; }
.room.lamp-on .ph-night { --lb: 16%; }
.room.lamp-off .ph-off { opacity: 1; }
.room.lamp-off .ph-glow { opacity: 0; }
.ph-night { transition: background 900ms; }
.lamp-spot { position: absolute; left: 61%; top: 0; width: 20%; height: 80%; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 30% 30% 20% 20%; }
.lamp-spot:focus-visible { outline: 2px solid var(--ivory); outline-offset: 2px; }
.ph-fade { position: absolute; inset: 0 0 auto; height: 26%; background: linear-gradient(var(--ground), transparent); pointer-events: none; }
html[dir="ltr"] .explore { inset-inline-start: var(--gutter-l); }
.explore__ring { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: var(--glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--hairline); }
.explore__label { font: 500 14px/20px var(--font-ar-text); color: #F4EFE9; text-shadow: 0 1px 10px rgba(20,10,5,.75), 0 0 2px rgba(20,10,5,.6); white-space: nowrap; }
html[lang="en"] .explore__label { font: 600 11px/16px var(--font-en-text); letter-spacing: .12em; text-transform: uppercase; }

/* the wall switch: a real brass toggle on the wall beside the lamp — up: lamp on (evening), down: lamp off (daylight) */
.wall-switch { position: absolute; left: 83%; top: 47.8%; width: max(56px, 4.4%); aspect-ratio: 1; translate: -50% -50%; z-index: 4; padding: 0; border: 0; border-radius: 50%;
  background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; filter: drop-shadow(1px 3px 3px rgba(40,20,5,.5)) drop-shadow(0 0 1px rgba(40,20,5,.4));
  transition: transform var(--dur-quick) var(--ease-arrive); }
.wall-switch:active { transform: scale(.95); }
.wall-switch:focus-visible { outline: 2px solid var(--ivory); outline-offset: 4px; }
.ws-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 140ms linear;
  filter: brightness(calc(var(--photo-bright) * (.82 + var(--light) * .22))) sepia(calc(var(--room-warm) * .5)); }
.wall-switch[aria-checked="true"] .ws-off, .wall-switch[aria-checked="false"] .ws-on { opacity: 0; }
.ws-pulse { position: absolute; left: 83%; top: 47.8%; width: max(56px, 4.4%); aspect-ratio: 1; translate: -50% -50%; z-index: 3; pointer-events: none; }
.ws-pulse i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,214,140,.9); box-shadow: 0 0 12px rgba(255,190,90,.6);
  animation: ws-ring 2.4s cubic-bezier(.2,.6,.3,1) infinite; opacity: 0; }
.ws-pulse i:nth-child(2) { animation-delay: 1.2s; }
@keyframes ws-ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }
.ws-hint { position: absolute; left: 83%; top: calc(47.8% + max(36px, 2.8%)); translate: -50% 0; z-index: 4; display: grid; justify-items: center; gap: 2px; padding: 4px 12px 7px;
  white-space: nowrap; border-radius: var(--radius-md); background: rgba(28,20,19,.7); color: #F4EFE9; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  pointer-events: none; transition: opacity 500ms; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.ws-arrow { color: #FFD48A; animation: ws-bob 1.6s ease-in-out infinite; }
@keyframes ws-bob { 50% { transform: translateY(-4px); } }
.ws-row { display: inline-flex; align-items: center; gap: 7px; }
.ws-mini { color: #FFD48A; flex: none; }
.ws-mini__knob { animation: ws-flip 2.4s ease-in-out infinite; }
@keyframes ws-flip { 0%, 40% { transform: translateY(0); } 50%, 90% { transform: translateY(8px); } 100% { transform: translateY(0); } }
.ws-hint b { font: 600 13px/1.3 var(--font-ar-text); }
html[lang="en"] .ws-hint b { font: 600 12px/1.3 var(--font-en-text); letter-spacing: .02em; }
.ws-hint small { font: 600 9px/1.2 var(--font-en-text); letter-spacing: .12em; text-transform: uppercase; opacity: .85; }

.ws-pulse.is-quiet i { animation: none; opacity: 0; }
.ws-hint.is-quiet .ws-arrow, .ws-hint.is-quiet .ws-mini__knob { animation: none; }
@media (prefers-reduced-motion: reduce) { .ws-pulse i, .ws-arrow, .ws-mini__knob { animation: none; } .ws-pulse i:first-child { opacity: .7; } }

/* the pull-chain: drag or tap to move the light on */
.pull { position: absolute; left: 75.6%; top: 31.7%; width: 0; height: 0; z-index: 3; }
.pull__chain { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.pull__beads, .pull__shine, .pull__shadow { fill: none; stroke-linecap: round; }
.pull__shadow { stroke: rgba(30,18,8,.35); stroke-width: 4.4; stroke-dasharray: 0 5.2; transform: translate(1.6px, 1.4px); filter: blur(.6px); }
.pull__beads { stroke: #8A6510; stroke-width: 3.8; stroke-dasharray: 0 5.2; }
.pull__shine { stroke: #F6D982; stroke-width: 1.5; stroke-dasharray: 0 5.2; transform: translate(-.7px, -.7px); }
.pull__knob { position: absolute; left: 0; top: 0; width: 48px; height: 64px; margin: 0; padding: 8px 12px 12px; border: 0; background: none; cursor: grab; touch-action: none;
  transform-origin: 24px 8px; -webkit-tap-highlight-color: transparent; filter: drop-shadow(1px 3px 3px rgba(30,18,8,.45)); }
.pull__knob:active { cursor: grabbing; }
.pull__knob svg { display: block; width: 24px; height: 44px; filter: brightness(calc(.85 + var(--light) * .25)); }
.pull__knob:focus-visible { outline: 2px solid var(--ivory); outline-offset: -4px; border-radius: 16px; }
.pull__hint { position: absolute; top: 0; left: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; white-space: nowrap; border-radius: var(--radius-pill);
  background: rgba(28,20,19,.62); color: #F4EFE9; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font: 600 12px/1 var(--font-ar-text); pointer-events: none;
  transition: opacity 500ms, translate 500ms var(--ease-arrive); }
html[lang="en"] .pull__hint { font: 600 11px/1 var(--font-en-text); letter-spacing: .08em; text-transform: uppercase; }
.pull__hint svg { animation: hint-nudge 1.6s ease-in-out infinite; }
@keyframes hint-nudge { 50% { transform: translateY(3px); } }
.pull__hint.is-gone { opacity: 0; translate: 0 6px; }

/* table lamp on a side table */
.lampset { position: absolute; bottom: 19%; inset-inline-end: 4%; width: min(30vw, 150px); display: grid; justify-items: center; pointer-events: none; }
.lamp { position: relative; display: grid; justify-items: center; width: 100%; border: 0; background: none; padding: 0; cursor: pointer; pointer-events: auto; border-radius: var(--radius-md); }
.lamp__head { position: relative; width: 78%; display: grid; justify-items: center; filter: drop-shadow(0 0 calc(var(--light) * 22px) var(--lamp-glow)); }
.lamp__shade { position: relative; z-index: 1; width: 100%; aspect-ratio: 1.5; clip-path: polygon(17% 0, 83% 0, 100% 100%, 0 100%);
  background: linear-gradient(to bottom, color-mix(in srgb, #FFDFA0 calc(var(--light) * 100%), #E9DCC4), color-mix(in srgb, #FFF2D2 calc(var(--light) * 100%), #D9C7A8)); }
.lamp__shade::after { content: ""; position: absolute; inset: auto 0 0; height: 5px; background: rgba(0,0,0,.12); }
.lamp__stem { width: 5px; height: clamp(34px, 6svh, 56px); background: linear-gradient(90deg, #8a6510, #EBC764 50%, #8a6510); }
.lamp__base { width: 46%; height: 16px; border-radius: 50% 50% 6px 6px / 100% 100% 6px 6px; background: linear-gradient(160deg, #EBC764, #8a6510); }
.lamp__spill { position: absolute; left: 50%; bottom: -14px; width: 150%; height: 34px; margin-left: -75%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--lamp-glow), transparent); opacity: calc(.3 + var(--light) * .9); z-index: 2; pointer-events: none; }
.pool { position: absolute; left: 50%; top: 40%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; z-index: 0;
  background: radial-gradient(circle, var(--lamp-glow), transparent 62%); transform: scale(calc(var(--glow-scale, 1) * (.35 + var(--light) * .95))); pointer-events: none; mix-blend-mode: screen;
  transition: transform 600ms var(--ease-arrive); }
.room.lamp-bright .pool { --glow-scale: 1.35; }
.room.lamp-bright .lamp__head { filter: drop-shadow(0 0 calc(10px + var(--light) * 30px) var(--lamp-glow)); }
.side-table { position: relative; width: 100%; filter: brightness(var(--room-bright)) sepia(var(--room-warm)); }
.side-table__top { height: 10px; border-radius: 5px; background: #7A5134; box-shadow: 0 2px 0 #5A3A26; }
.side-table__legs { height: clamp(96px, 15svh, 150px); background: linear-gradient(90deg, transparent 12%, #5A3A26 12% 18%, transparent 18% 82%, #5A3A26 82% 88%, transparent 88%); }
.side-table__shadow { position: absolute; left: -6%; right: -6%; bottom: -8px; height: 18px; border-radius: 50%; background: radial-gradient(closest-side, var(--shade), transparent); filter: blur(4px); }
/* the hero piece: demonstration silhouette */
.piece { position: absolute; bottom: 19%; inset-inline-start: 2%; width: min(66vw, 400px); }
.piece svg { display: block; width: 100%; height: auto; overflow: visible; }
.piece__shadow { position: absolute; left: 6%; right: 2%; bottom: -5%; height: 16%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--shade), transparent); filter: blur(calc(var(--shadow-blur) * .5));
  transform: translateX(calc((1 - var(--light) * 1.6) * 9%)) scaleX(calc(1.25 - var(--light) * .35)); }
.wood { fill: #7A5134; } .wood-dark { fill: #5A3A26; } .fabric { fill: var(--teal); } .fabric-shade { fill: #0F5D66; }
.rim { fill: url(#rimlight); opacity: var(--light); mix-blend-mode: screen; }
.demo { position: absolute; padding: 3px 8px; border-radius: var(--radius-sm); background: var(--ground-raised); color: var(--ink);
  font: 600 10px/14px var(--font-en-text); letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--hairline); white-space: nowrap; z-index: 2; }

/* headline */
.intro { position: absolute; inset-inline: 0; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 58px); display: grid; justify-items: center; text-align: center;
  padding-inline: var(--gutter-l) var(--gutter-r); will-change: transform, opacity; }
.intro__logo { height: clamp(64px, 10svh, 150px); width: auto; display: block; clip-path: inset(100% 0 0 0); animation: reveal-up 1400ms var(--ease-arrive) 200ms forwards; }
.intro__ar { margin: var(--space-1) 0 0; font: 600 clamp(28px, 7.8vw, 60px)/1.25 var(--font-ar-display); color: var(--ink); }
.intro__en { margin: 0; font: italic 400 clamp(18px, 4.6vw, 28px)/1.2 var(--font-en-display); color: var(--ink-muted); }
.line { display: block; overflow: hidden; padding-block: .06em; }
.line > span { display: block; transform: translateY(105%); animation: rise 900ms var(--ease-arrive) forwards; }
.intro__ar .line > span { animation-delay: 700ms; }
.intro__en .line > span { animation-delay: 860ms; }
.explore { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); inset-inline-start: var(--gutter-r); text-decoration: none; display: grid; justify-items: center; gap: 2px;
  padding: 0; gap: var(--space-2); justify-items: center; color: var(--ink); opacity: 0; animation: fade 900ms 1300ms forwards; }
.explore img { width: 28px; height: auto; display: block; margin-top: 4px; animation: nudge 2.4s ease-in-out 2.4s infinite; transition: filter 400ms; }
html.is-night .explore img { filter: brightness(1.9) saturate(.85); }
.explore b { font: 500 15px/24px var(--font-ar-text); }
.explore small { font: 600 10px/14px var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
@keyframes reveal-up { to { clip-path: inset(0 0 0 0); } }
@keyframes rise { to { transform: none; } }
@keyframes fade { to { opacity: 1; } }
@keyframes nudge { 50% { transform: translateY(5px); } }
.dim { position: fixed; inset: 0; z-index: 60; background: var(--walnut); opacity: 0; pointer-events: none; transition: opacity var(--dur-blink) var(--ease-light); }

/* ---------- sections ---------- */
.section { position: relative; padding-block: var(--space-8); padding-inline: var(--gutter-l) var(--gutter-r); }
.eyebrow { margin: 0; font: 600 11px/16px var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
.h2 { margin: var(--space-1) 0 0; font: 600 clamp(36px, 10vw, 64px)/1.3 var(--font-ar-display); text-wrap: balance; }
html[lang="en"] .h2 { font: 400 clamp(34px, 9vw, 60px)/1.05 var(--font-en-display); letter-spacing: -.01em; }
.lead { margin: var(--space-3) 0 0; max-width: 34em; color: var(--ink-muted); }

/* ---------- collection arc ---------- */
.arc { position: relative; height: calc(min(50svh, 470px) + 40px); margin-top: var(--space-5); overflow: hidden; perspective: 1100px; touch-action: pan-y; outline-offset: -3px;
  margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); }
.card { position: absolute; top: 14px; left: 50%; width: min(70vw, 340px); height: min(50svh, 470px); margin-left: calc(min(70vw, 340px) / -2); border-radius: var(--radius-lg); overflow: hidden;
  background: var(--ground-sunk); box-shadow: var(--shadow-object); text-decoration: none; color: var(--ivory); will-change: transform; cursor: grab; user-select: none;
  transition: transform 560ms var(--ease-arrive), opacity 560ms var(--ease-arrive); -webkit-tap-highlight-color: transparent; }
.card.dragging { transition: none; cursor: grabbing; }
.card__plate { position: absolute; inset: 0; }
.card__photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(var(--photo-bright)) sepia(calc(var(--room-warm) * .4));
  animation: drift-in 18s ease-in-out infinite alternate; transform-origin: 50% 40%; }
@keyframes drift-in { from { transform: scale(1.02); } to { transform: scale(1.1); } }
.card__glow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; background: radial-gradient(38% 26% at 50% 24%, rgba(255,214,130,calc(.12 + var(--light) * .4)), transparent 70%); animation: breathe 6s ease-in-out infinite; }
.p-furniture { background: radial-gradient(90% 60% at 50% 30%, #8a6047, #3a2618 80%); }
.p-accessories { background: radial-gradient(90% 60% at 40% 30%, var(--rose), #4a2230 85%); }
.p-art { background: radial-gradient(90% 60% at 50% 30%, #1f8f9b, #0a3237 85%); }
.p-lighting { background: radial-gradient(60% 45% at 50% 30%, #f6cf6c, #8a5f08 55%, #2a1c08 100%); }
.card__motif { position: absolute; top: 16%; left: 50%; width: 46%; margin-left: -23%; opacity: .9; }
.card__desc { display: block; margin-top: var(--space-2); font: 400 15px/1.7 var(--font-ar-text); opacity: .92; max-width: 26em; }
html[lang="en"] .card__desc { font: 400 15px/1.5 var(--font-en-text); }
.card__plate::after { content: ""; position: absolute; inset: 0; }
.p-furniture::after { background: linear-gradient(105deg, transparent 35%, rgba(255,230,190,.16) 50%, transparent 65%); background-size: 260% 100%; animation: sweep 9s ease-in-out infinite; }
.card[data-k-col="accessories"] .card__motif { animation: float 7s ease-in-out infinite; }
.p-art::after { background: radial-gradient(40% 30% at 30% 70%, rgba(212,160,23,.35), transparent 70%), radial-gradient(35% 28% at 72% 40%, rgba(104,45,63,.55), transparent 70%); animation: drift 14s ease-in-out infinite alternate; }
.p-lighting::after { background: radial-gradient(40% 30% at 50% 30%, rgba(255,214,130,calc(.25 + var(--light) * .45)), transparent 70%); animation: breathe 6s ease-in-out infinite; }
@keyframes sweep { 0%,100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes drift { to { transform: translate(-6%, 4%) scale(1.08); } }
@keyframes breathe { 50% { transform: scale(1.06); opacity: .8; } }
.card__body { position: absolute; inset-inline: 0; bottom: 0; padding: var(--space-5) var(--space-4) var(--space-4); background: linear-gradient(to top, rgba(28,20,19,.86), rgba(28,20,19,0)); }
.card__idx { direction: ltr; unicode-bidi: isolate; display: block; text-align: end; font: 600 11px/16px var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; }

.card__name { display: block; margin-top: 2px; font: 600 40px/1.3 var(--font-ar-display); }
html[lang="en"] .card__name { font: 400 32px/1.15 var(--font-en-display); }
.card .demo { top: var(--space-3); inset-inline-start: var(--space-3); }
.dots { display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-2); }
.dots button { width: 32px; height: 32px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
.dots button::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-control); transition: transform 300ms, background 300ms; }
.dots button[aria-current="true"]::after { background: #2A97A3; transform: scale(1.5); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-4); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--touch-min); padding: 0 var(--space-5); border-radius: var(--radius-pill);
  border: 1px solid var(--line-control); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; font: 500 15px/1 var(--font-ar-text);
  transition: transform var(--dur-quick) var(--ease-arrive); }

.btn:active { transform: scale(.97); }
.orn-actions { gap: var(--space-3); align-items: start; margin-top: var(--space-2); }
.orn { display: grid; justify-items: center; gap: var(--space-2); width: min(240px, 44vw); padding: 4px; border: 0; background: none; color: var(--ink); cursor: pointer;
  text-decoration: none; -webkit-tap-highlight-color: transparent; border-radius: var(--radius-md); }
.orn__shape { display: block; width: min(224px, 42vw); aspect-ratio: 588 / 340; background: var(--ink-muted);
  -webkit-mask: url("assets/img/btn-shape.webp") center / contain no-repeat; mask: url("assets/img/btn-shape.webp") center / contain no-repeat;
  transition: transform 400ms var(--ease-arrive), background-color 300ms; }
.orn--diamond .orn__shape { width: min(120px, 32vw); aspect-ratio: 340 / 368;
  -webkit-mask-image: url("assets/img/btn-diamond.webp"); mask-image: url("assets/img/btn-diamond.webp"); }
.orn--primary .orn__shape { background: #2A97A3; }
.orn:hover .orn__shape, .orn:focus-visible .orn__shape { transform: scale(1.06); background: #2A97A3; }
.orn:active .orn__shape { transform: scale(.96); }
.orn__label { font: 500 16px/1.5 var(--font-ar-text); text-align: center; text-wrap: balance; }
html[lang="en"] .orn__label { font: 500 15px/1.4 var(--font-en-text); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn--quiet { border-color: transparent; padding-inline: var(--space-3); text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--accent); }
.btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.notice { display: flex; gap: var(--space-3); align-items: flex-start; margin: var(--space-4) auto 0; max-width: 520px; padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm);
  background: var(--notice-soft); color: var(--notice); font: 500 13px/20px var(--font-ar-text); }

.notice code { font: 500 12px/20px ui-monospace, Menlo, monospace; direction: ltr; unicode-bidi: isolate; }
.notice svg { flex: none; margin-top: 2px; }

/* ---------- shared editorial ---------- */
.draftnote { margin-top: var(--space-4); }
.display-ar { margin: var(--space-1) 0 0; font: 700 clamp(40px, 11.5vw, 84px)/1.3 var(--font-ar-display); text-wrap: balance; }
html[lang="en"] .display-ar { font: 400 clamp(40px, 11vw, 84px)/1.04 var(--font-en-display); letter-spacing: -.02em; }
.sub-en { margin: 0; font: italic 400 clamp(18px, 4.8vw, 26px)/1.3 var(--font-en-display); color: var(--ink-muted); }
html[lang="en"] .sub-en { font: 500 clamp(18px, 4.8vw, 24px)/1.6 var(--font-ar-text); font-style: normal; }

/* ---------- our story: a journey of details ---------- */
.story { border-top: 1px solid var(--hairline); }
.run { position: relative; height: 460svh; }
.run__stage { position: sticky; top: 0; height: 100svh; min-height: 600px; overflow: hidden; background: var(--ground-sunk); }
.scene { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
.scene > * { position: absolute; }
/* 1 · the door */
.door { inset: 0; background:
    radial-gradient(circle at 50% 50%, transparent 20px, rgba(40,24,14,.55) 21px 25px, transparent 26px 34px, rgba(40,24,14,.45) 35px 38px, transparent 39px) 0 0 / 96px 96px,
    linear-gradient(90deg, rgba(0,0,0,.25) 0 2px, transparent 2px) 0 0 / 96px 100%,
    radial-gradient(60% 40% at 30% 30%, rgba(122,81,52,.9), transparent 70%),
    radial-gradient(50% 35% at 75% 70%, rgba(110,70,48,.85), transparent 70%),
    linear-gradient(160deg, #1d6f78, #0f4f57);
  clip-path: inset(calc(var(--p0) * 20%) calc(var(--p0) * 24%) calc(var(--p0) * 30%) round calc(var(--p0) * 18px));
  filter: brightness(calc(var(--room-bright) * .95)) sepia(var(--room-warm)); }
.door__sun { inset: -10% auto -10% 0; width: 38%; background: linear-gradient(90deg, transparent, rgba(255,236,190,.42) 45%, rgba(255,236,190,.42) 55%, transparent);
  transform: translateX(calc(-40% + var(--p0) * 260%)) skewX(-14deg); mix-blend-mode: screen; opacity: calc(1 - var(--light) * .7); }
.door__frame { inset: calc(20% - 10px) calc(24% - 10px) calc(30% - 22px); border: 10px solid #5A3A26; border-bottom-width: 22px; border-radius: 26px; opacity: var(--p0); }
.door__legs { left: 30%; right: 30%; bottom: calc(30% - 22px - 44px); height: 44px; opacity: var(--p0);
  background: linear-gradient(90deg, #5A3A26 0 10px, transparent 10px calc(100% - 10px), #5A3A26 calc(100% - 10px)); }
/* 2 · the fabric */
.weave { inset: 0; background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 2px, transparent 2px 4px),
    radial-gradient(120% 90% at 30% 20%, #26a0ac, #0b4a52);
  background-size: 8px 8px, 8px 8px, 100% 100%; animation: weave 9s linear infinite;
  clip-path: inset(calc(var(--p1) * 34%) calc(var(--p1) * 16%) calc(var(--p1) * 27%) round calc(var(--p1) * 70px) calc(var(--p1) * 70px) calc(var(--p1) * 22px) calc(var(--p1) * 22px));
  filter: contrast(calc(1 + var(--light) * .3)) brightness(var(--room-bright)); }
@keyframes weave { to { background-position: 0 8px, 8px 0, 0 0; } }
.weave__frame { left: calc(16% - 14px); right: calc(16% - 14px); top: calc(34% - 14px); bottom: calc(27% - 60px); opacity: var(--p1); }
.weave__frame svg { width: 100%; height: 100%; display: block; }
/* 3 · the object */
.obj { inset: 0; background: linear-gradient(to bottom, var(--ground) 0 68%, var(--ground-sunk) 68%); }
.obj__chair { left: 50%; bottom: 20%; width: min(70vw, 380px); margin-left: calc(min(70vw, 380px) / -2); }
.obj__chair svg { display: block; width: 100%; height: auto; }
.obj__after { clip-path: inset(0 calc((1 - var(--p2)) * 100%) 0 0); }
.obj__before svg { filter: grayscale(.85) brightness(.9); }
.obj__line { top: 8%; bottom: 8%; left: calc(50% - min(70vw, 380px) / 2 + var(--p2) * min(70vw, 380px)); width: 2px; background: var(--ink); opacity: calc(var(--p2) * (1 - var(--p2)) * 3); }
/* 4 · the home */
.home { inset: 0; background: linear-gradient(to bottom, var(--ground) 0 66%, var(--ground-sunk) 66%); }
.home__art { top: 20%; inset-inline-start: 12%; width: 22%; aspect-ratio: 4/5; padding: 6px; background: var(--ivory); box-shadow: 0 10px 20px -12px rgba(0,0,0,.5);
  transform: translateY(calc((1 - var(--p3)) * -30px)); opacity: calc(.2 + var(--p3)); }
.home__art i { display: block; width: 100%; height: 100%; background: linear-gradient(135deg, var(--teal) 0 45%, var(--maroon) 45% 80%, var(--heritage-yellow) 80%); }
.home__chair { bottom: 22%; inset-inline-start: 8%; width: 52%; transform: translateX(calc((1 - var(--p3)) * -40px)); filter: brightness(var(--room-bright)) sepia(var(--room-warm)); }
.home__chair svg { width: 100%; height: auto; display: block; }
.home__lamp { bottom: 22%; inset-inline-end: 10%; width: 22%; display: grid; justify-items: center; transform: translateX(calc((1 - var(--p3)) * 40px)); }
.home__lamp b { width: 80%; aspect-ratio: 1.5; clip-path: polygon(17% 0, 83% 0, 100% 100%, 0 100%); background: color-mix(in srgb, #FFDFA0 calc(var(--light) * 100%), #E9DCC4); }
.home__lamp i { width: 4px; height: 26px; background: #B88A20; }
.home__lamp u { width: 100%; height: 70px; border-top: 8px solid #7A5134; background: linear-gradient(90deg, transparent 12%, #5A3A26 12% 18%, transparent 18% 82%, #5A3A26 82% 88%, transparent 88%); filter: brightness(var(--room-bright)); }
.home__glow { bottom: 30%; inset-inline-end: -20%; width: 90%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--lamp-glow), transparent 62%); transform: scale(calc(.4 + var(--light))); mix-blend-mode: screen; }
.home__shade { inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 45%, var(--shade)); }
.run__cap { left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); z-index: 4; margin: 0; padding-inline: var(--gutter-l) var(--gutter-r); text-align: center;
  font: 600 clamp(30px, 8.4vw, 58px)/1.4 var(--font-ar-display); color: var(--ink); text-wrap: balance; opacity: var(--co, 0); transform: translateY(calc((1 - var(--co, 0)) * 14px)); }
html[lang="en"] .run__cap { font: italic 400 clamp(30px, 8.4vw, 60px)/1.1 var(--font-en-display); }
.run__cap small { display: block; margin-top: var(--space-1); font: italic 400 17px/1.4 var(--font-en-display); color: var(--ink-muted); }
html[lang="en"] .run__cap small { font: 500 16px/1.6 var(--font-ar-text); font-style: normal; }
.run__cap > span { display: inline-block; max-width: 30rem; padding: var(--space-3) var(--space-5); border-radius: var(--radius-lg); background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.1); backdrop-filter: blur(18px) saturate(1.1); border: 1px solid var(--hairline); }
.run__ticks { position: absolute; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 84px); inset-inline-start: var(--gutter-l); display: grid; gap: 6px; }
.run__ticks i { width: 3px; height: 22px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 25%, transparent); }
.run__ticks i.on { background: var(--accent); }
/* real photographs in the story: they start as a close-up and pull back as you scroll */
.scene__photo { inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(var(--photo-bright)) sepia(calc(var(--room-warm) * .4)); will-change: transform; }
.scene[data-s="1"] .scene__photo { object-position: 70% 55%; transform-origin: 62% 58%; transform: scale(calc(2.1 - var(--p1) * 1.1)); }
.scene[data-s="0"] .scene__photo { object-position: 50% 50%; transform-origin: 74% 46%; transform: scale(calc(2.4 - var(--p0) * 1.4)); }
.scene[data-s="2"] .scene__photo { object-position: 50% 50%; transform-origin: 42% 50%; transform: scale(calc(2.2 - var(--p2) * 1.2)); }
.scene__sun { inset: -10% auto -10% 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,236,190,.35) 45%, rgba(255,236,190,.35) 55%, transparent);
  transform: translateX(calc(-60% + var(--p0) * 300%)) skewX(-14deg); mix-blend-mode: soft-light; opacity: var(--sun-op); pointer-events: none; }
.scene[data-s="3"] .scene__photo { object-position: 50% 60%; transform-origin: 50% 32%; transform: scale(calc(1.9 - var(--p3) * .9)); }
.scene__night { inset: 0; background: radial-gradient(120% 90% at 50% 40%, rgba(20,10,10,.15), rgba(16,8,9,.85)); mix-blend-mode: multiply; opacity: calc(var(--night-op) * .85); pointer-events: none; }
.run__stage > .demo.is-hidden { display: none; }
.run__stage > .demo { top: calc(env(safe-area-inset-top, 0px) + 84px); inset-inline-end: var(--gutter-r); z-index: 4; }
.story__text { display: grid; gap: var(--space-6); }
.founder { margin: 0; display: grid; gap: var(--space-3); justify-items: start; }
.founder img { display: block; width: min(72vw, 300px); aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 18%; border-radius: 999px 999px var(--radius-md) var(--radius-md);
  background: var(--photo-plate); box-shadow: var(--shadow-object); }
.founder figcaption { font: 600 20px/1.5 var(--font-ar-display); }
html[lang="en"] .founder figcaption { font: 400 22px/1.2 var(--font-en-display); }
.founder figcaption small { display: block; font: 600 10px/16px var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
html[lang="en"] .founder figcaption small { font: 500 13px/20px var(--font-ar-text); letter-spacing: 0; text-transform: none; }
@media (min-width: 900px) { .story__text { grid-template-columns: 320px minmax(0, 1fr); align-items: start; column-gap: var(--space-8); }
  .story__text > .draftnote { grid-column: 1 / -1; } .founder { position: sticky; top: 100px; } }
.portrait { position: relative; width: min(60vw, 240px); aspect-ratio: 4/5; border-radius: var(--radius-md); background: var(--photo-plate); border: 1px dashed var(--line-control);
  display: grid; place-items: center; text-align: center; padding: var(--space-3); font: 600 10px/14px var(--font-en-text); letter-spacing: .1em; text-transform: uppercase; color: #65524D; }
/* Founder signature: watermark stamp on every item photo + signature under the founder letter */
html { font-synthesis-weight: none; }
:root { --sig: url(assets/img/signature.webp); }
.wm { position: absolute; z-index: 3; inset-inline-end: 12px; bottom: 10px; width: clamp(64px, 26%, 120px); aspect-ratio: 260 / 119; pointer-events: none;
  background: var(--sig) center / contain no-repeat; filter: brightness(0) invert(1) drop-shadow(0 1px 2px rgba(30,20,18,.55)); opacity: .82; }
.wmbox { position: relative; display: block; }
.card .wm { bottom: auto; top: 30%; width: clamp(60px, 28%, 104px); }

/* ---------- material archive ---------- */

.mats { display: flex; gap: var(--space-4); overflow-x: auto; scroll-snap-type: x mandatory; padding: var(--space-4) var(--gutter-r) var(--space-5) var(--gutter-l); margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); scrollbar-width: none; overscroll-behavior-x: contain; }

  transition: transform var(--dur-quick) var(--ease-arrive), box-shadow var(--dur-quick); }

.mat__meta { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); margin-top: var(--space-3); }

.mat__pair { position: absolute; top: var(--space-3); inset-inline-end: var(--space-3); z-index: 3; min-width: var(--touch-min); height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-pill);
  border: 1px solid rgba(255,255,255,.6); background: rgba(28,20,19,.55); color: #F4EFE9; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer; font: 500 13px/1 var(--font-ar-text); display: inline-flex; align-items: center; gap: 6px; }

.mat__pair[aria-pressed="true"] { background: #F4EFE9; color: #302523; }
.mat .demo { bottom: var(--space-3); top: auto; inset-inline-start: var(--space-3); }
/* textures (demonstration samples) + light response */
.tex { position: absolute; inset: 0; }
.tex::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.tex-light { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 70% at 70% 15%, rgba(255,196,104,calc(var(--ml) * .45)), transparent 70%); mix-blend-mode: soft-light; }
.materials.neutral .tex-light { display: none; }
.t-wood { background: radial-gradient(ellipse 34% 7% at 62% 38%, #3f2718 0 40%, transparent 70%), radial-gradient(ellipse 22% 5% at 28% 74%, #3f2718 0 35%, transparent 70%),
  repeating-linear-gradient(93deg, #5b3a26 0 3px, #6e4630 3px 7px, #4f321f 7px 9px, #7a5134 9px 15px, #684129 15px 18px);
  filter: sepia(calc(var(--ml) * .35)) saturate(calc(1 + var(--ml) * .35)) brightness(calc(1 - var(--ml) * .18)); }
.t-velvet { background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px),
  radial-gradient(120% 80% at 30% 20%, #23a0ac, #0b4a52); filter: contrast(calc(1 + var(--ml) * .35)) brightness(calc(1 - var(--ml) * .12)); }

.t-paint { background: repeating-linear-gradient(88deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px), repeating-linear-gradient(3deg, rgba(0,0,0,.05) 0 1px, transparent 1px 6px), linear-gradient(160deg, #7f3c50, #4e1f2e);
  filter: saturate(calc(1 + var(--ml) * .2)); }
.t-marble { background: linear-gradient(118deg, transparent 38%, rgba(232,226,220,.55) 39%, transparent 40.5%), linear-gradient(64deg, transparent 58%, rgba(232,226,220,.35) 59%, transparent 60%),
  linear-gradient(140deg, transparent 20%, rgba(200,190,182,.3) 21%, transparent 22%), linear-gradient(98deg, transparent 72%, rgba(232,226,220,.4) 72.6%, transparent 73.6%), radial-gradient(90% 70% at 40% 30%, #3a3433, #1d1918); }
.t-marble::after { background: linear-gradient(125deg, transparent calc(20% + var(--ml) * 40%), rgba(255,255,255,calc(.16 - var(--ml) * .06)) calc(30% + var(--ml) * 40%), transparent calc(40% + var(--ml) * 40%)); }
.t-brass { background: radial-gradient(circle at 22% 70%, rgba(60,120,100,.4), transparent 12%), radial-gradient(circle at 74% 24%, rgba(60,120,100,.3), transparent 9%),
  linear-gradient(120deg, #7a5810, #c9971a 38%, #e8c45e 50%, #a27612 62%, #634608); }
.t-brass::after { background: linear-gradient(105deg, transparent calc(18% + var(--ml) * 44%), rgba(255,244,210,calc(.5 + var(--ml) * .3)) calc(26% + var(--ml) * 44%), transparent calc(34% + var(--ml) * 44%)); mix-blend-mode: screen; }

.t-callig span { position: absolute; inset: -20% -30% auto auto; font: 800 clamp(150px, 46vw, 230px)/1 var(--font-ar-display); color: #302523; opacity: .92; transform: rotate(-8deg); white-space: nowrap; }
.t-ornament { background: radial-gradient(circle at 50% 50%, transparent 16px, rgba(40,24,14,.6) 17px 21px, transparent 22px 28px, rgba(40,24,14,.5) 29px 31px, transparent 32px) 0 0 / 70px 70px,
  radial-gradient(circle at 0 0, rgba(40,24,14,.5) 0 6px, transparent 7px) 0 0 / 70px 70px, repeating-linear-gradient(93deg, #6e4630 0 4px, #7a5134 4px 9px); filter: sepia(calc(var(--ml) * .3)) brightness(calc(1 - var(--ml) * .15)); }
.t-ornament::after { box-shadow: inset 0 0 calc(20px + var(--ml) * 50px) rgba(0,0,0,.35); }
.t-found { background: radial-gradient(ellipse 18% 10% at 30% 30%, #7a5134 0 60%, transparent 62%), radial-gradient(ellipse 12% 7% at 70% 62%, #7a5134 0 60%, transparent 62%),
  radial-gradient(ellipse 9% 14% at 46% 82%, #6a4429 0 60%, transparent 62%), repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 7px), #6f938f; filter: saturate(calc(.85 + var(--ml) * .25)) sepia(calc(var(--ml) * .2)); }
/* detail */
.matdetail { margin-top: var(--space-2); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--ground-raised); border: 1px solid var(--hairline);
  display: grid; gap: var(--space-5); animation: grow 520ms var(--ease-arrive); transform-origin: 50% 0; }
@keyframes grow { from { opacity: 0; transform: scaleY(.92); } }
.matdetail__swatch { position: relative; height: 200px; border-radius: var(--radius-md); overflow: hidden; }
.matdetail h3 { margin: 0; font: 600 32px/1.4 var(--font-ar-display); }
html[lang="en"] .matdetail h3 { font: 400 34px/1.1 var(--font-en-display); }
.facts { margin: 0; display: grid; gap: var(--space-3); }
.facts div { display: grid; grid-template-columns: 9em 1fr; gap: var(--space-3); align-items: baseline; }
.facts dt { font-size: 14px; color: var(--ink-muted); } .facts dd { margin: 0; }
/* pairing */
.pairing { margin-top: var(--space-5); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--ground-raised); border: 1px solid var(--hairline); display: grid; gap: var(--space-4); }
.pairing__stage { position: relative; height: 240px; }
.pairing__a, .pairing__b { position: absolute; top: 50%; overflow: hidden; box-shadow: var(--shadow-object); }
.pairing__a { width: 58%; height: 190px; margin-top: -95px; inset-inline-start: 4%; border-radius: var(--radius-md); animation: pair-a 900ms var(--ease-arrive) both; }
.pairing__b { width: 46%; aspect-ratio: 1; margin-top: calc(-23% + 10px); inset-inline-end: 6%; border-radius: 50%; animation: pair-b 900ms var(--ease-arrive) 80ms both; }
@keyframes pair-a { from { transform: translateX(-30%); opacity: 0; } }
@keyframes pair-b { from { transform: translateX(30%); opacity: 0; } }
html[dir="rtl"] .pairing__a { animation-name: pair-b; } html[dir="rtl"] .pairing__b { animation-name: pair-a; }
.pairing h3 { margin: 0; font: 700 clamp(32px, 9vw, 52px)/1.35 var(--font-ar-display); }

.pairing__names { margin: 0; font: 500 17px/1.6 var(--font-ar-text); }
.ideas { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }

/* ---------- craftsmanship ---------- */
.craft { border-top: 1px solid var(--hairline); }
.beginnings { margin: var(--space-6) 0 0; padding: 0; list-style: none; display: grid; gap: var(--space-3); max-width: 34em; }
.beginnings__lead { font: 500 clamp(20px, 5.4vw, 28px)/1.6 var(--font-ar-text); margin: var(--space-6) 0 0; max-width: 24em; }
html[lang="en"] .beginnings__lead { font: 400 clamp(22px, 5.6vw, 30px)/1.3 var(--font-en-display); }
.beginnings li { display: grid; grid-template-columns: 44px 1fr; gap: var(--space-3); align-items: center; }
.beginnings li i { width: 44px; height: 44px; border-radius: var(--radius-md); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.m-antique { background: repeating-linear-gradient(95deg, #7a5134 0 5px, #6a4429 5px 8px); }
.m-carved { background: radial-gradient(circle at 50% 50%, transparent 30%, #5a3a26 31% 38%, transparent 39%), repeating-linear-gradient(0deg, #8a6047 0 4px, #7a5134 4px 7px); }
.m-door { background: linear-gradient(90deg, transparent 46%, var(--heritage-yellow) 46% 54%, transparent 54%), linear-gradient(0deg, transparent 46%, var(--heritage-yellow) 46% 54%, transparent 54%), var(--teal); }
.m-fabric { background: repeating-linear-gradient(45deg, var(--maroon) 0 3px, #4a1f2c 3px 6px); }
.craft__ba { display: grid; justify-items: center; gap: var(--space-3); margin-top: var(--space-7); }
.ba { position: relative; width: 100%; max-width: 420px; aspect-ratio: 4 / 5; border-radius: var(--radius-md); overflow: hidden; touch-action: pan-y; user-select: none; background: var(--photo-plate); cursor: ew-resize; }
.ba__layer { position: absolute; inset: 0; }
.ba__img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%; display: block; }
.ba__night { filter: brightness(.5) saturate(1.25) sepia(.25) contrast(1.08); }
.ba__lamp { position: absolute; left: 62%; top: 30%; width: 90%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
  background: radial-gradient(circle, rgba(255,206,130,.75), rgba(255,160,70,.25) 32%, transparent 62%); }
.ba__before-unused { background: repeating-linear-gradient(100deg, #8f7a63 0 6px, #857057 6px 9px); filter: saturate(.45) brightness(.95); }
.ba__before::after { content: ""; position: absolute; inset: 20% 22%; border-radius: 40px 40px 12px 12px; background: #9b8c7c; box-shadow: inset 0 0 0 6px #7d6e60; }
.ba__after { clip-path: inset(0 0 0 var(--split, 50%)); }
.ba__after-unused::after { content: ""; position: absolute; inset: 20% 22%; border-radius: 40px 40px 12px 12px; background: var(--teal); box-shadow: inset 0 0 0 6px var(--heritage-yellow); }
.ba__divider { position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; margin-left: -1px; background: var(--ivory); box-shadow: 0 0 0 1px rgba(48,37,35,.35); }
.ba__handle { position: absolute; top: 50%; left: 50%; width: var(--touch-min); height: var(--touch-min); margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(251,248,244,.7);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid #8A7A74; display: grid; place-items: center; color: #302523; }
.ba__tag { position: absolute; top: var(--space-3); padding: 4px 10px; border-radius: var(--radius-pill); background: #FBF8F4; color: #302523; font: 600 11px/16px var(--font-en-text); letter-spacing: .1em; text-transform: uppercase; }
.ba .demo { top: auto; bottom: var(--space-3); left: var(--space-3); }
.caption { margin: 0; max-width: 420px; font-size: 13px; line-height: 20px; color: var(--ink-muted); text-align: center; }
.closing { margin: var(--space-7) 0 0; font: 600 clamp(28px, 7.6vw, 52px)/1.45 var(--font-ar-display); text-wrap: balance; }
html[lang="en"] .closing { font: italic 400 clamp(30px, 8vw, 56px)/1.1 var(--font-en-display); }
.closing small { display: block; margin-top: var(--space-2); font: italic 400 18px/1.4 var(--font-en-display); color: var(--ink-muted); }
html[lang="en"] .closing small { font: 500 17px/1.6 var(--font-ar-text); font-style: normal; }

/* ---------- bespoke ---------- */
.bespoke { border-top: 1px solid var(--hairline); }

.steps { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: var(--space-4); }
.steps::before { content: ""; position: absolute; top: 23px; inset-inline: 12.5%; height: 1px; background: var(--line-control); }
.steps::after { content: ""; position: absolute; top: 23px; inset-inline-start: 12.5%; height: 2px; margin-top: -.5px; width: calc(var(--step) * 25%); background: #2A97A3; transition: width 600ms var(--ease-arrive); }
.step { position: relative; z-index: 1; display: grid; justify-items: center; gap: var(--space-1); border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--ink-muted); min-height: var(--touch-min); }
.step span { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--ground); border: 1px solid var(--line-control);
  font: 600 13px/1 var(--font-en-text); transition: background 300ms, color 300ms, border-color 300ms; }
.step b { font: 500 13px/1.4 var(--font-ar-text); text-align: center; }

.stage { margin-top: var(--space-5); display: grid; gap: var(--space-5); touch-action: pan-y; }

.stage__text h3 { margin: 0; font: 600 30px/1.45 var(--font-ar-display); }

.stage__text .lead { color: var(--ink); font-weight: 500; }
.stage__text p + p { margin-top: var(--space-2); }
.stage-in { animation: stage-in 520ms var(--ease-arrive); }
@keyframes stage-in { from { opacity: .2; transform: translateY(10px); } }
/* stage visuals (demonstration) */
.v-photo { width: 44%; aspect-ratio: 4/5; top: 18%; inset-inline-start: 10%; border-radius: 10px; background: linear-gradient(160deg, #c9b8a8, #8a7462); transform: rotate(-6deg); box-shadow: 0 10px 20px -10px rgba(0,0,0,.5); }
.v-chip { width: 30%; aspect-ratio: 1; top: 26%; inset-inline-start: 46%; border-radius: 10px; background: var(--teal); transform: rotate(5deg); box-shadow: 0 10px 20px -10px rgba(0,0,0,.5); }
.v-dot { width: 18%; aspect-ratio: 1; top: 56%; inset-inline-start: 66%; border-radius: 50%; background: var(--heritage-yellow); }

.v-sketch { inset: 0; width: 100%; height: 100%; }
.v-grain { inset: 0; background: repeating-linear-gradient(98deg, #7a5134 0 6px, #6a4429 6px 10px, #84593a 10px 13px); }
.v-carve { width: 120px; height: 120px; top: 50%; left: 50%; margin: -60px; border-radius: 50%; box-shadow: inset 0 0 0 10px #5a3a26, inset 0 0 0 22px #7a5134, inset 0 0 0 28px #5a3a26; }
.v-reveal { inset: 0; background: radial-gradient(60% 70% at 50% 35%, color-mix(in srgb, var(--lamp) 55%, transparent), transparent 70%), var(--ground-sunk); }
.v-plinth { width: 36%; height: 30%; bottom: 0; left: 32%; border-radius: 12px 12px 0 0; background: var(--ground-raised); }
.v-object { width: 22%; aspect-ratio: 3/4; bottom: 30%; left: 39%; border-radius: 40px 40px 8px 8px; background: var(--teal); box-shadow: inset 0 0 0 5px var(--heritage-yellow), var(--shadow-object); }
.begin { margin-top: var(--space-7); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--ground-raised); border: 1px solid var(--hairline); }
.begin h3 { margin: 0; font: 600 32px/1.4 var(--font-ar-display); }

.files { font: 400 13px/20px var(--font-ar-text); color: var(--ink-muted); }

/* ---------- FAQ ---------- */
.curious { margin-top: var(--space-8); }

.contact-list div { display: flex; gap: var(--space-3); align-items: baseline; }

.faq { border-top: 1px solid var(--hairline); }
.acc { margin-top: var(--space-6); border-top: 1px solid var(--hairline); max-width: 760px; }
.acc details { border-bottom: 1px solid var(--hairline); }
.faq-more { margin-top: var(--space-4); min-height: var(--touch-min); padding: 0 var(--space-5); border-radius: var(--radius-pill); border: 1px solid var(--line-control); background: none; color: var(--ink); cursor: pointer; font: 500 15px/1 var(--font-ar-text); }

/* ---------- commercial ---------- */
.commercial { border-top: 1px solid var(--hairline); }

.wa { white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-2); justify-self: start; min-height: var(--touch-min); padding: 0 var(--space-5); border-radius: var(--radius-pill);
  background: #1F7A4D; color: #FFFFFF; text-decoration: none; font: 600 15px/1 var(--font-ar-text); }

  background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--font-ar-text); }

/* ---------- quiet closing ---------- */
.viewing__photo { display: block; width: 100%; max-width: 980px; margin: 0 auto var(--space-6); aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-lg); box-shadow: var(--shadow-object); filter: brightness(var(--photo-bright)) sepia(calc(var(--room-warm) * .4)); }
.viewing { text-align: center; border-top: 1px solid var(--hairline); }
.viewing .h2 { font-size: clamp(30px, 8vw, 48px); }
.viewing .lead { margin-inline: auto; }
.foot { position: relative; isolation: isolate; overflow: hidden; }
/* the iron grille: a window of Dafi's ironwork the page closes behind */
.foot::before { content: ""; position: absolute; inset: 0 0 auto; height: 100%; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, transparent, #2A97A3 30%, #2A97A3 50%, transparent 92%);
  -webkit-mask: url("assets/img/grille.webp") top center / 460px auto repeat; mask: url("assets/img/grille.webp") top center / 460px auto repeat;
  opacity: .28; }
.tone-ivory.foot::before { opacity: .22; }
.faq + .foot, .faq { padding-bottom: var(--space-7); }
.foot { padding: var(--space-7) var(--gutter-r) calc(var(--space-9) + env(safe-area-inset-bottom, 0px)) var(--gutter-l); text-align: center; color: var(--ink-muted); }
.foot__mark { display: block; width: min(300px, 78vw); aspect-ratio: 784 / 262; margin: 0 auto var(--space-6); background: var(--ink);
  -webkit-mask: url("assets/img/tagline-mark.webp") center / contain no-repeat; mask: url("assets/img/tagline-mark.webp") center / contain no-repeat; }
.foot b { display: block; font: 600 28px/1.5 var(--font-ar-display); color: var(--ink); }
.foot span { font: italic 400 18px/1.4 var(--font-en-display); }

/* ---------- sheet (collection detail) ---------- */
.sheet { position: fixed; z-index: 55; inset: auto 0 0; max-height: 86svh; overflow: auto; background: var(--ground-raised); color: var(--ink);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.45); padding: var(--space-5) var(--gutter-r) calc(var(--space-7) + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  transform: translateY(105%); transition: transform 560ms var(--ease-arrive); }
.sheet.is-open { transform: none; }
.sheet__grab { width: 44px; height: 4px; border-radius: 4px; background: var(--line-control); margin: 0 auto var(--space-4); }
.sheet__top { display: flex; justify-content: space-between; align-items: start; gap: var(--space-4); }
.sheet h3 { margin: 0; font: 600 34px/1.35 var(--font-ar-display); }
html[lang="en"] .sheet h3 { font: 400 34px/1.1 var(--font-en-display); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-5); }

.feat img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--radius-md); display: block; background: var(--photo-plate); }
.feat figcaption { font-size: 13px; line-height: 1.5; color: var(--ink-muted); }

  font: 600 10px/14px var(--font-en-text); letter-spacing: .1em; text-transform: uppercase; color: #65524D; padding: var(--space-3); }
.scrim { position: fixed; inset: 0; z-index: 54; background: rgba(20,14,13,.45); opacity: 0; pointer-events: none; transition: opacity 400ms; }
.scrim.is-on { opacity: 1; pointer-events: auto; }
.close { width: var(--touch-min); height: var(--touch-min); border-radius: 50%; border: 1px solid var(--line-control); background: none; cursor: pointer; display: grid; place-items: center; flex: none; }

/* ---------- menu ---------- */
.menu { position: fixed; z-index: 70; inset: 0; background: var(--menu-ground); color: var(--on-menu); overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + var(--space-7)) var(--gutter-l);
  clip-path: circle(0% at calc(100% - 40px) 34px); visibility: hidden; transition: clip-path 720ms var(--ease-arrive), visibility 0s 720ms; }
html[dir="rtl"] .menu { clip-path: circle(0% at 40px 34px); }
.menu.is-open { clip-path: circle(150% at calc(100% - 40px) 34px); visibility: visible; transition: clip-path 720ms var(--ease-arrive), visibility 0s; }
html[dir="rtl"] .menu.is-open { clip-path: circle(150% at 40px 34px); }
.menu :focus-visible { outline-color: var(--on-menu); }
.menu__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5); }
.menu__top img { height: 56px; width: auto; display: block; }
.menu .close { border-color: var(--on-menu); color: var(--on-menu); }
.menu ol { list-style: none; margin: 0; padding: 0; position: relative; }
.menu li { opacity: 0; transform: translateY(14px); }
.menu.is-open li { animation: rise-in var(--dur-reveal) var(--ease-arrive) forwards; animation-delay: calc(var(--i) * 50ms + 160ms); }
@keyframes rise-in { to { opacity: 1; transform: none; } }
.menu__item { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); min-height: 56px; width: 100%; padding: 0 var(--space-1); padding-inline-start: var(--space-6);
  background: none; border: 0; color: var(--on-menu); text-decoration: none; cursor: pointer; text-align: start; }
.menu__item b { font: 600 28px/1.65 var(--font-ar-display); }
html[lang="en"] .menu__item b { font: 400 30px/1.4 var(--font-en-display); }
.menu__item span { font: 600 10px/14px var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; }
.menu__item em { font: 500 11px/14px var(--font-ar-text); font-style: normal; padding: 2px 8px; border: 1px solid var(--on-menu); border-radius: var(--radius-pill); }
.menu__dot { position: absolute; inset-inline-start: var(--space-2); top: 28px; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--lamp);
  box-shadow: 0 0 16px 4px var(--lamp-glow); transition: top var(--dur-blink) var(--ease-arrive); }

.menu__sub a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 var(--space-3); border: 1px solid var(--on-menu); border-radius: var(--radius-pill); text-decoration: none; font: 500 14px/1 var(--font-ar-text); }
.menu .notice { margin: var(--space-2) 0 0; }

/* ---------- light dial ---------- */
.dial { position: fixed; z-index: 50; right: calc(var(--space-4) + env(safe-area-inset-right, 0px)); bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: var(--space-3); direction: ltr; }
.dial__orb { position: relative; width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--hairline); padding: 0; cursor: pointer;
  background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.5);
  touch-action: manipulation; }
.dial__orb::before { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--lamp);
  box-shadow: 0 0 calc(10px + 26px * var(--light)) calc(2px + 8px * var(--light)) var(--lamp-glow); }

  background: conic-gradient(from 200deg, transparent 0 calc(var(--light) * 300deg), color-mix(in srgb, var(--lamp) 0%, transparent) 0); }
.dial__panel { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); width: min(288px, calc(100vw - 112px));

.dial__title { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.dial__title b { font: 600 14px/22px var(--font-ar-text); direction: rtl; }
.dial__title span { font: 600 10px/16px var(--font-en-text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
.dial__track { position: relative; height: var(--touch-min); touch-action: none; cursor: grab; border-radius: var(--radius-pill); }
.dial__track::before { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--ivory), var(--heritage-yellow) 50%, var(--walnut)); box-shadow: 0 0 0 1px var(--line-control); }
.dial__thumb { position: absolute; top: 50%; left: calc(14px + var(--light) * (100% - 28px)); width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%;
  background: var(--lamp); border: 2px solid var(--ink); box-shadow: 0 0 18px 4px var(--lamp-glow); }
.dial__marks { display: flex; justify-content: space-between; }
.dial__marks button { min-width: var(--touch-min); min-height: 40px; border: 0; background: none; color: var(--ink-muted); cursor: pointer; border-radius: var(--radius-sm);
  font: 500 13px/1 var(--font-ar-text); display: grid; gap: 3px; justify-items: center; padding: var(--space-1); }
.dial__marks button[aria-pressed="true"] { color: var(--ink); }
.dial__marks small { font: 600 9px/1 var(--font-en-text); letter-spacing: .12em; text-transform: uppercase; }
.dial__hint { margin: 0; font: 400 11px/16px var(--font-en-text); color: var(--ink-muted); }

.toast { position: fixed; z-index: 80; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  background: var(--walnut); color: var(--ivory); padding: 10px 16px; border-radius: var(--radius-pill); font: 500 14px/20px var(--font-ar-text); max-width: calc(100vw - 32px); text-align: center;
  transition: opacity 300ms, transform 300ms var(--ease-arrive); }

/* phones & small tablets: the lamp fills the upper screen, words sit on the dark table below */
@media (max-width: 899px) {
  .room { background: #140c0a; }
  .photo-zone { top: 0; height: 76%; transform-origin: 50% 35%; }
  .frame { left: calc(50cqw - var(--fw) * .715); }
  .ph-fade { inset: auto 0 0; height: 46%; background: linear-gradient(to bottom, rgba(20,12,10,0), rgba(20,12,10,.8) 60%, #140c0a); }
  .photo-zone::after { content: ""; position: absolute; inset: 0 0 auto; height: 110px; pointer-events: none; background: linear-gradient(rgba(20,12,10,.55), rgba(20,12,10,0)); }
  .intro { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); }
  .intro__logo { height: clamp(48px, 7svh, 68px); }
  .intro__ar { color: #F4EFE9; font-size: clamp(30px, 8.6vw, 44px); }
  .intro__en { color: rgba(244,239,233,.85); }
  .wall-switch, .ws-pulse { left: 81%; top: 50%; width: 52px; }
  .ws-hint { left: 81%; top: calc(50% + 34px); translate: calc(-100% + 26px) 0; padding: 4px 10px 6px; }
  .ws-hint small { display: none; }
  .ws-hint b { font-size: 12px; }
}

@media (min-width: 900px) {
  .piece { width: 460px; bottom: 17%; inset-inline-start: calc(50% - 330px); }
  .lampset { inset-inline-end: calc(50% - 360px); width: 170px; bottom: 17%; }
  .photo-zone { top: 0; height: auto; }
  .frame { left: calc((100cqw - var(--fw)) * .62); }
  .ph-fade { inset: 0 auto 0 0; width: 52%; height: auto; background: linear-gradient(90deg, var(--ground) 0 30%, color-mix(in srgb, var(--ground) 60%, transparent) 62%, transparent); }
  .intro { inset-inline: auto; left: 4%; width: 40%; top: 50%; margin-top: -190px; }
  .art { inset-inline-start: 14%; width: 200px; top: 30%; }
  .stage { grid-template-columns: 1fr 1fr; align-items: center; } .stage__visual { height: 320px; }
  .section { padding-inline: max(48px, calc((100vw - 1100px) / 2)); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .intro__logo { animation: none; clip-path: none; }
  .line > span { animation: none; transform: none; }
  .explore { animation: none; opacity: 1; } .explore img { animation: none; }
  .card, .sheet, .menu, .dial__panel { transition-duration: 120ms; }
  .menu.is-open li { animation: none; opacity: 1; transform: none; }
  .card__plate::after, .card__motif { animation: none !important; } .stage-in { animation: none; }
  .card__photo, .card__glow { animation: none; } .pull__hint svg { animation: none; } .weave { animation: none; } .matdetail, .pairing__a, .pairing__b { animation: none; }
}

/* ---------- colour blocks: each chapter sits on one solid colour from the Dafi palette (no gradients, no fades) ---------- */
.tone { background: var(--ground); color: var(--ink); border-top: 0 !important; }
.tone-maroon { --ground:#682D3F; --ground-raised:#753849; --ground-sunk:#5A2536; --ink:#F4EFE9; --ink-muted:#E6D2D6; --accent:#F2C94C; --on-accent:#302523;
  --hairline:rgba(244,239,233,.22); --line-control:#D9BCC3; --focus-ring:#F2C94C; --photo-bright:1; }
.tone-ivory { --ground:#F4EFE9; --ground-raised:#FBF8F4; --ground-sunk:#DDD5D0; --ink:#302523; --ink-muted:#65524D; --accent:#147581; --on-accent:#FBF8F4;
  --hairline:rgba(48,37,35,.16); --line-control:#8A7A74; --focus-ring:#147581; --photo-bright:1; --notice:#7A5A08; --notice-soft:#F6E7BC; }
.tone-teal { --ground:#147581; --ground-raised:#1B8592; --ground-sunk:#0F616B; --ink:#F4EFE9; --ink-muted:#DCEFF1; --accent:#F4EFE9; --on-accent:#147581;
  --hairline:rgba(244,239,233,.25); --line-control:#BFE0E4; --focus-ring:#F4EFE9; --photo-bright:1; }
.tone-yellow { --ground:#D4A017; --ground-raised:#DEB13E; --ground-sunk:#B9880C; --ink:#302523; --ink-muted:#46341C; --accent:#682D3F; --on-accent:#F4EFE9;
  --hairline:rgba(48,37,35,.22); --line-control:#5E4A20; --focus-ring:#302523; --photo-bright:1; }
.tone-rose { --ground:#B88E8D; --ground-raised:#C49D9C; --ground-sunk:#A47A79; --ink:#302523; --ink-muted:#3E2A2A; --accent:#682D3F; --on-accent:#F4EFE9;
  --hairline:rgba(48,37,35,.22); --line-control:#5A3C3B; --focus-ring:#302523; --photo-bright:1; }
.tone .orn__shape { background: var(--ink-muted); }
.tone .orn--primary .orn__shape, .tone .orn:hover .orn__shape, .tone .orn:focus-visible .orn__shape { background: var(--accent); }
.tone .step[aria-selected="true"] span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* craftsmanship: the light-study image stays pinned while the story scrolls past it */
.craft__grid { display: grid; gap: var(--space-5); margin-top: var(--space-5); }
.craft__pin { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 2; background: var(--ground); padding-bottom: var(--space-3); align-self: start; }
.craft__pin .craft__ba { margin-top: 0; gap: var(--space-2); }
.craft__pin .ba { height: min(40svh, 340px); aspect-ratio: auto; max-width: none; }
.craft__pin .caption { font-size: 12px; line-height: 18px; }

/* =====================================================================
   LIGHTING ENGINE — one value, 0..1, interpolated in OKLCH
   ===================================================================== */
const KF = {
  "ground":["#F4EFE9","#EBD3B6","#1C1413"], "ground-raised":["#FBF8F4","#F3E2CC","#2A1F1D"], "ground-sunk":["#DDD5D0","#D8B48E","#120C0B"],
  "ink":["#302523","#2A1C1B","#F4EFE9"], "ink-muted":["#65524D","#5E3F3A","#C4B2A9"],
  "hairline":["rgba(48,37,35,0.16)","rgba(42,28,27,0.2)","rgba(244,239,233,0.14)"], "line-control":["#8A7A74","#7E5E4E","#8C7A72"],
  "accent":["#147581","#682D3F","#5FB8C2"], "on-accent":["#FBF8F4","#F4EFE9","#1C1413"], "menu-ground":["#147581","#682D3F","#4A1D2B"],
  "focus-ring":["#147581","#682D3F","#E3B53A"], "lamp":["#E8B23A","#F0B04A","#FFC468"],
  "lamp-glow":["rgba(212,160,23,0.16)","rgba(236,164,58,0.46)","rgba(255,184,77,0.62)"], "sunlight":["rgba(255,240,214,0.6)","rgba(244,170,92,0.34)","rgba(255,240,214,0)"],
  "shade":["rgba(48,37,35,0.2)","rgba(104,45,63,0.32)","rgba(8,5,5,0.72)"], "glass":["rgba(251,248,244,0.56)","rgba(243,226,204,0.5)","rgba(42,31,29,0.56)"],
  "notice":["#7A5A08","#6B4A05","#E3B53A"], "notice-soft":["#F6E7BC","#F2D9A2","#3A2C10"], "danger":["#9E2F2A","#8C2420","#F2907F"]
};
const SWITCHED = new Set(["ink","ink-muted","on-accent","notice","notice-soft","focus-ring","danger"]); // switch, never fade
const GROUNDS = new Set(["ground","ground-raised","ground-sunk"]);            // pass mid-luminance quickly
const SCALARS = { "room-bright":[1,.92,.72], "room-warm":[0,.18,.1], "sun-op":[1,.45,0], "glow-r":[40,90,140], "shadow-blur":[18,32,60],
  "dusk-op":[0,1,.2], "night-op":[0,.3,1], "glow-op":[.1,.55,1], "photo-bright":[1,.97,.9] };
const SWITCH_AT = .72;

function parseColor(s){ if(s[0]==="#"){const h=s.slice(1);return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).concat(1);} const m=s.match(/[\d.]+/g).map(Number); return [m[0]/255,m[1]/255,m[2]/255,m.length>3?m[3]:1]; }
const toLin=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4), toGam=c=>c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055;
function toOklch([r,g,b,a]){ r=toLin(r);g=toLin(g);b=toLin(b);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b), m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b), s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const L=.2104542553*l+.793617785*m-.0040720468*s, A=1.9779984951*l-2.428592205*m+.4505937099*s, B=.0259040371*l+.7827717662*m-.808675766*s;
  return [L,Math.hypot(A,B),Math.atan2(B,A),a]; }
function fromOklch([L,C,H,a]){ const A=C*Math.cos(H),B=C*Math.sin(H);
  const l=Math.pow(L+.3963377774*A+.2158037573*B,3), m=Math.pow(L-.1055613458*A-.0638541728*B,3), s=Math.pow(L-.0894841775*A-1.291485548*B,3);
  const rgb=[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(c=>Math.round(Math.min(1,Math.max(0,toGam(c)))*255));
  return `rgba(${rgb.join(",")},${a.toFixed(3)})`; }
function mixColor(x,y,t){ const p=toOklch(parseColor(x)), q=toOklch(parseColor(y));
  let h1=p[2],h2=q[2]; if(p[1]<.02)h1=h2; if(q[1]<.02)h2=h1; let dh=h2-h1; if(dh>Math.PI)dh-=2*Math.PI; if(dh<-Math.PI)dh+=2*Math.PI;
  return fromOklch([p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t, h1+dh*t, p[3]+(q[3]-p[3])*t]); }
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};

const root=document.documentElement; let light=0;
function applyLight(v){
  light=Math.min(1,Math.max(0,v)); const seg=light<.5?0:1, t=(light-seg*.5)/.5;
  for(const k in KF){ const f=KF[k]; let val;
    if(SWITCHED.has(k)) val = light<SWITCH_AT ? (light<.25?f[0]:f[1]) : f[2];
    else { const tt = (seg===1 && GROUNDS.has(k)) ? smooth(.34,.54,t) : t; val = mixColor(f[seg],f[seg+1],tt); }
    root.style.setProperty("--"+k,val); }
  for(const k in SCALARS){ const f=SCALARS[k], s=f[seg]+(f[seg+1]-f[seg])*t; root.style.setProperty("--"+k, k==="glow-r"?s+"%":k==="shadow-blur"?s+"px":s.toFixed(3)); }
  root.style.setProperty("--light",light.toFixed(3));
  root.style.setProperty("--halo",(1-smooth(0,.09,Math.abs(light-SWITCH_AT))).toFixed(3)); // contrast halo only near the switch
  const night = light>=SWITCH_AT; root.classList.toggle("is-night", night); document.getElementById("barLogo").src = night?LOGO.ivory:LOGO.teal; document.getElementById("heroLogo").src = night?LOGO.ivory:LOGO.teal;
  const tr=document.getElementById("track"); tr.setAttribute("aria-valuenow",Math.round(light*100));
  tr.setAttribute("aria-valuetext", light<.25?"نهار · Day":light<.75?"غروب · Dusk":"ليل · Night");
  document.querySelectorAll("#marks button").forEach(b=>b.setAttribute("aria-pressed", Math.abs(+b.dataset.v-light)<.13?"true":"false"));
}

let saveT; function store(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem("dafi.light.v2", String(light)); }catch(e){} },300); }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function easeTo(target){ const from=light, t0=performance.now(), D=reduce?0:1400;
  (function step(now){ let p=D?Math.min(1,(now-t0)/D):1; p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; applyLight(from+(target-from)*p); if(p<1) requestAnimationFrame(step); else store(); })(t0); }

function reveal(btnId, formId){ const b=document.getElementById(btnId), f=document.getElementById(formId);
  b.addEventListener("click",()=>{ f.hidden=!f.hidden; b.setAttribute("aria-expanded",!f.hidden); if(!f.hidden){ const t=f.querySelector("input,select,a,button"); t&&t.focus(); return; } if(false) f.querySelector("input,select").focus(); }); }
reveal("pvBtn","pvForm");
function wireForm(formId, required, statusId, submitId){
  document.getElementById(formId).addEventListener("submit",async e=>{
    e.preventDefault(); const f=e.target, C=K[lang].common, status=document.getElementById(statusId); let bad=null;
    f.querySelectorAll(".field__error.req").forEach(x=>x.remove()); f.querySelectorAll("[data-invalid]").forEach(x=>x.removeAttribute("data-invalid"));
    for(const id of required){ const el=document.getElementById(id);
      if(!el.value.trim()){ const fl=el.closest(".field"); fl.setAttribute("data-invalid",""); el.setAttribute("aria-invalid","true"); el.setAttribute("aria-describedby",id+"-e");
        fl.insertAdjacentHTML("beforeend",`<span class="field__error req" id="${id}-e">${C.required}</span>`); bad=bad||el; } else el.removeAttribute("aria-invalid"); }
    if(bad){ bad.focus(); return; }
    if(!CONFIG.formsEndpoint){ status.innerHTML=`<p style="margin:0;color:var(--ink-muted)">${C.notYet}</p>`; return; }
    const btn=document.getElementById(submitId), label=btn.textContent; btn.textContent=C.sending; btn.disabled=true;
    try{ const res=await fetch(CONFIG.formsEndpoint,{method:"POST",body:new FormData(f)}); if(!res.ok) throw 0;
      status.innerHTML=`<p style="margin:0;color:var(--accent);font-weight:600">${C.sent}</p>`; f.reset(); }
    catch(_){ status.innerHTML=`<p style="margin:0;color:var(--danger);font-weight:600">${C.failed}</p>`; }
    finally{ btn.textContent=label; btn.disabled=false; } });
}
