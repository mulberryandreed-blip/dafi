/* toast */
let toastT; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("is-on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("is-on"),2600); }

/* =====================================================================
   COLLECTION ARC
   ===================================================================== */
const arc=document.getElementById("arc"), dots=document.getElementById("dots"); let sel=0, cards=[];
const motif = `<svg class="card__motif" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" fill="none" stroke="rgba(244,239,233,.35)" stroke-width="1"/><path d="M16 50a34 34 0 0 1 34-34" fill="none" stroke="rgba(244,239,233,.7)" stroke-width="2" stroke-linecap="round"/></svg>`;
function buildArc(){
  arc.innerHTML = COLLECTIONS.map((c,i)=>`<a class="card" href="#" data-i="${i}" data-k-col="${c.key}" draggable="false">${c.image ? `<img class="card__photo" src="${c.image}" alt="${c.alt}" draggable="false"><span class="wm" aria-hidden="true"></span>${c.key==="lighting"?'<span class="card__glow"></span>':""}` : `<div class="card__plate ${c.plate}"></div>${motif}<span class="demo">Demonstration</span>`}
    <div class="card__body"><span class="card__idx">${c.idx}</span><span class="card__name">${lang==="ar"?c.ar:c.en}</span><span class="card__desc">${lang==="ar"?c.leadAr:c.leadEn}</span></div></a>`).join("");
  dots.innerHTML = COLLECTIONS.map((c,i)=>`<button type="button" data-i="${i}" aria-label="${c.idx}"></button>`).join("");
  arc.setAttribute("aria-label", lang==="ar"?"المجموعات":"Collections");
  dots.setAttribute("aria-label", lang==="ar"?"اختر مجموعة":"Choose a collection");
  cards=[...arc.children];
  cards.forEach(c=>c.addEventListener("click",e=>{ e.preventDefault(); if(moved) return; const i=+c.dataset.i; if(i===sel) openSheet(false); else { sel=i; layout(); } }));
  dots.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ sel=+b.dataset.i; layout(); }));
  layout();
}
function layout(drag=0){
  const rtl=root.dir==="rtl", dir=rtl?-1:1, step=innerWidth>=900?220:178;
  cards.forEach((c,i)=>{ const o=(i-sel)+drag, a=Math.abs(o);
    const x=o*step*dir*(innerWidth<600?innerWidth/390*1.42:1), z=-a*150, ry=reduce?0:-o*18*dir, y=reduce?0:a*a*12;
    c.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg)`; c.style.opacity = a>2.3?0:1-a*.2; c.style.zIndex=10-Math.round(a);
    c.tabIndex = i===sel?0:-1; c.setAttribute("aria-hidden", i===sel?"false":"true");
    c.setAttribute("aria-label", `${COLLECTIONS[i].idx} — ${lang==="ar"?COLLECTIONS[i].ar:COLLECTIONS[i].en}`); });
  dots.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-current", i===sel?"true":"false"));
  const c=COLLECTIONS[sel], url=CONFIG.shopifyCollections[c.key];
  document.querySelector("#actExplore .orn__label").textContent=T[lang].explore2;
  document.querySelector("#actFeatured .orn__label").textContent=T[lang].featured;
  const shop=document.getElementById("actShop"); shop.querySelector(".orn__label").textContent=`${T[lang].shop} · ${lang==="ar"?c.ar:c.en}`;
  wireShop(shop, url, c.key, "shopNotice");
}
function wireShop(a, url, key, noticeId){
  if(url){ a.href=url; a.removeAttribute("aria-disabled"); a.onclick=null; document.getElementById(noticeId).innerHTML=""; }
  else { a.href="#"; a.setAttribute("aria-disabled","true"); a.onclick=e=>e.preventDefault();
         document.getElementById(noticeId).innerHTML = CONFIG.devMode ? note(NOTES.shop[lang](key)) : ""; if(!CONFIG.devMode) a.hidden=true; }
}
let sx=null, dx=0, moved=false;
arc.addEventListener("pointerdown",e=>{ sx=e.clientX; dx=0; moved=false; cards.forEach(c=>c.classList.add("dragging")); });
addEventListener("pointermove",e=>{ if(sx===null) return; const step=innerWidth>=900?220:178; dx=(e.clientX-sx)/step*(root.dir==="rtl"?-1:1); if(Math.abs(e.clientX-sx)>6) moved=true; layout(dx); });
function endDrag(){ if(sx===null) return; cards.forEach(c=>c.classList.remove("dragging")); sel=Math.max(0,Math.min(cards.length-1,Math.round(sel-dx))); sx=null; layout(); setTimeout(()=>moved=false,0); }
addEventListener("pointerup",endDrag); addEventListener("pointercancel",endDrag);
arc.addEventListener("keydown",e=>{ const rtl=root.dir==="rtl"; const f=rtl?{ArrowLeft:1,ArrowRight:-1}:{ArrowLeft:-1,ArrowRight:1};
  if(f[e.key]){ e.preventDefault(); sel=Math.max(0,Math.min(cards.length-1,sel+f[e.key])); layout(); }
  if(e.key==="Enter"){ e.preventDefault(); openSheet(false); } });
document.getElementById("actExplore").addEventListener("click",()=>openSheet(false));
document.getElementById("actFeatured").addEventListener("click",()=>openSheet(true));

/* sheet */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"); let lastFocus;
function openSheet(toFeatured){ const c=COLLECTIONS[sel]; lastFocus=document.activeElement;
  document.getElementById("sheetIdx").textContent=c.idx;
  document.getElementById("sheetTitle").textContent= lang==="ar"?c.ar:c.en;
  document.getElementById("sheetLead").textContent= lang==="ar"?c.leadAr:c.leadEn;
  const feat=FEATURED[c.key]||[];
  document.getElementById("slots").innerHTML = feat.length ? feat.map(f=>`<figure class="feat"><span class="wmbox"><img src="${f.img}" alt="${lang==="ar"?f.ar:f.en}" loading="lazy"><span class="wm" aria-hidden="true"></span></span><figcaption>${lang==="ar"?f.ar:f.en}</figcaption></figure>`).join("") : [1,2,3,4].map(()=>`<div class="slot">${T[lang].slot}</div>`).join("");

  setTimeout(()=>{ (toFeatured?document.getElementById("featuredHead"):document.getElementById("sheetClose")).scrollIntoView({block:"nearest"}); document.getElementById("sheetClose").focus({preventScroll:true}); },60); }
function closeSheet(){ sheet.classList.remove("is-open"); scrim.classList.remove("is-on"); setTimeout(()=>{ sheet.hidden=true; },560); lastFocus&&lastFocus.focus&&lastFocus.focus(); }
document.getElementById("sheetClose").addEventListener("click",closeSheet); scrim.addEventListener("click",closeSheet);

   MENU
   ===================================================================== */
const menu=document.getElementById("menu"), menuBtn=document.getElementById("menuBtn"), menuList=document.getElementById("menuList"), menuDot=document.getElementById("menuDot");
function buildMenu(){
  menuList.querySelectorAll("li").forEach(li=>li.remove());
  MENU.forEach((m,i)=>{ const li=document.createElement("li"); li.style.setProperty("--i",i);
    const label=lang==="ar"?m.ar:m.en, tag=lang==="ar"?m.en:m.ar;
    li.innerHTML = `<a class="menu__item" href="${m.href||"#"}" data-key="${m.key}"${m.key==="discover"?' aria-current="page"':''}><b>${label}</b>${m.live?`<span>${lang==="ar"?tag:""}</span>`:`<em>${T[lang].soon}</em>`}</a>`;
    if(m.sub){ const sub=document.createElement("div"); sub.className="menu__sub";
      sub.innerHTML = COLLECTIONS.filter(c=>CONFIG.shopifyCollections[c.key]||CONFIG.devMode).map(c=>`<a href="${CONFIG.shopifyCollections[c.key]||"#"}" data-shop="${c.key}">${lang==="ar"?c.ar:c.en}</a>`).join("");
      li.appendChild(sub);
      if(CONFIG.devMode && Object.values(CONFIG.shopifyCollections).some(v=>!v)) li.insertAdjacentHTML("beforeend", note(lang==="ar"?"روابط Shopify الأربعة غير مضافة بعد: <code>shopifyCollections</code>":"The four Shopify URLs aren’t set yet: <code>shopifyCollections</code>")); }
    menuList.appendChild(li); });
  menuList.querySelectorAll(".menu__item").forEach(a=>{
    ["mouseenter","focus"].forEach(ev=>a.addEventListener(ev,()=>moveDot(a)));
    a.addEventListener("click",e=>{ const m=MENU.find(x=>x.key===a.dataset.key);
      if(!m.live){ e.preventDefault(); toast(T[lang].soonToast); return; }
      menuList.querySelectorAll(".menu__item").forEach(x=>x.removeAttribute("aria-current")); a.setAttribute("aria-current","page"); closeMenu(false); }); });
  menuList.querySelectorAll("[data-shop]").forEach(a=>a.addEventListener("click",e=>{ if(!CONFIG.shopifyCollections[a.dataset.shop]){ e.preventDefault(); toast(NOTES.shop[lang](a.dataset.shop).replace(/<[^>]+>/g,"")); } }));
  menuList.addEventListener("mouseleave",()=>moveDot(menuList.querySelector("[aria-current]")));
}
function moveDot(a){ if(a) menuDot.style.top=(a.offsetTop+a.offsetHeight/2)+"px"; }
function openMenu(){ menu.classList.add("is-open"); menu.setAttribute("aria-hidden","false"); menuBtn.setAttribute("aria-expanded","true"); document.body.style.overflow="hidden";
  setTimeout(()=>{ moveDot(menuList.querySelector("[aria-current]")); document.getElementById("menuClose").focus(); },80); }
function closeMenu(refocus=true){ menu.classList.remove("is-open"); menu.setAttribute("aria-hidden","true"); menuBtn.setAttribute("aria-expanded","false"); document.body.style.overflow=""; if(refocus) menuBtn.focus(); }
menuBtn.addEventListener("click",openMenu); document.getElementById("menuClose").addEventListener("click",()=>closeMenu());
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(menu.classList.contains("is-open")) closeMenu(); else if(!sheet.hidden) closeSheet(); else if(dial.dataset.open==="true"){ setOpen(false); orb.focus(); } }
  if(e.key==="Tab" && menu.classList.contains("is-open")){ const f=[...menu.querySelectorAll("a,button")].filter(x=>x.offsetParent); const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } } });

function onScroll(){ if(ticking) return; ticking=true; requestAnimationFrame(()=>{ ticking=false;
  const y=scrollY, span=arrival.offsetHeight-innerHeight, p=Math.min(1,Math.max(0,y/span));
  if(!reduce){ layers.forEach(l=>{ const d=+l.dataset.depth; l.style.transform = l.classList.contains("photo-zone") ? `scale(${1+p*.2})` : `translate3d(0,${-p*d*240}px,0) scale(${1+p*d*1.6})`; });
    intro.style.transform=`translate3d(0,${-p*120}px,0) scale(${1-p*.12})`; }
  intro.style.opacity = String(1-Math.min(1,p*1.6));
  const ex=document.getElementById("explore"); if(p>.02 || ex.style.animation==="none"){ ex.style.animation="none"; ex.style.opacity=String(Math.max(0,1-p*4)); ex.style.pointerEvents = p>.2?"none":""; }
  bar.classList.toggle("is-scrolled", p>.55);
  const max=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${max>0?y/max:0})`; }); }

/* ---------- the pull-chain: a small spring-and-pendulum simulation ---------- */
(()=>{
  const pull=document.getElementById("pull"), knob=document.getElementById("pullKnob"), svg=document.getElementById("pullSvg"), hint=document.getElementById("pullHint");
  const paths=["chainShadow","chainDark","chainLight"].map(id=>document.getElementById(id));
  const frame=pull.parentElement;
  let rest=70, len=70, vLen=0, ang=0, vAng=0, dragging=false, raf=0, visible=true, t0=performance.now(), lastTug=0, used=false;
  try{ used = localStorage.getItem("dafi.pulled")==="1"; }catch(e){}
  if(used) hint.classList.add("is-gone");
  const sizeRest=()=>{ rest=Math.max(56, Math.min(120, frame.clientHeight*.15)); if(!dragging && !raf) len=rest; };
  function draw(){
    const x=Math.sin(ang)*len, y=Math.cos(ang)*len;
    const d=`M0 0 Q ${x*.5+Math.sin(ang)*-4} ${y*.5} ${x} ${y}`;
    paths.forEach(p=>p.setAttribute("d",d));
    knob.style.transform=`translate(${x-24}px, ${y-8}px) rotate(${-ang}rad)`;
    hint.style.transform=`translate(${x}px, ${y+12}px)`;
  }
  function cycle(){
    const next = light<.25 ? .5 : light<.75 ? 1 : 0;
    easeTo(next);
    try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
    if(!used){ used=true; hint.classList.add("is-gone"); try{ localStorage.setItem("dafi.pulled","1"); }catch(e){} }
  }
  function step(now){
    raf=0;
    const dt=Math.min(.033,(now-(step.last||now))/1000)||.016; step.last=now;
    if(!dragging){
      // spring back to rest length, pendulum back to vertical
      const k=reduce?260:120, c=reduce?28:7.5;
      vLen += (-k*(len-rest) - c*vLen)*dt; len += vLen*dt;
      const g=reduce?60:22, ca=reduce?14:1.6;
      vAng += (-g*Math.sin(ang) - ca*vAng)*dt; ang += vAng*dt;
      // a whisper of air movement while idle
      if(!reduce) ang += Math.sin((now-t0)/1300)*.00035;
    }
    draw();
    const settled = !dragging && Math.abs(len-rest)<.2 && Math.abs(vLen)<.5 && Math.abs(vAng)<.002 && Math.abs(ang)<.004;
    if(settled && (reduce || used)){ return; }
    // until first use, give a small tug every few seconds so it reads as pullable
    if(!used && !dragging && now-lastTug>4200){ lastTug=now; vLen += 140; }
    if(visible) raf=requestAnimationFrame(step);
  }
  function start(){ if(!raf && visible){ step.last=undefined; raf=requestAnimationFrame(step); } }
  let startY=0, moved=false, maxLen=0;
  knob.addEventListener("pointerdown",e=>{ knob.setPointerCapture(e.pointerId); dragging=true; moved=false; startY=e.clientY; maxLen=len; start(); e.preventDefault(); });
  knob.addEventListener("pointermove",e=>{ if(!dragging) return;
    const r=pull.getBoundingClientRect(), dx=e.clientX-r.left, dy=Math.max(10, e.clientY-r.top);
    if(Math.abs(e.clientY-startY)>4) moved=true;
    len=Math.min(rest+70, Math.max(rest*.85, Math.hypot(dx,dy)));
    ang=Math.max(-.6, Math.min(.6, Math.atan2(dx,dy)));
    vLen=0; vAng=0; maxLen=Math.max(maxLen,len); });
  const release=e=>{ if(!dragging) return; dragging=false;
    if(!moved){ len=rest+30; vLen=-40; vAng=(Math.random()-.5)*.8; cycle(); }       // a tap is a quick tug
    else { vAng=-ang*1.2; if(maxLen-rest>18) cycle(); }                          // a real pull past the click point
  };
  knob.addEventListener("pointerup",release); knob.addEventListener("pointercancel",release);
  knob.addEventListener("click",e=>{ if(e.detail===0){ len=rest+30; vLen=-40; start(); cycle(); } }); // keyboard
  addEventListener("resize",sizeRest); sizeRest(); draw();
  // only animate while the room is on screen
  new IntersectionObserver(es=>es.forEach(en=>{ visible=en.isIntersecting; if(visible) start(); else { cancelAnimationFrame(raf); raf=0; } })).observe(pull);
})();

/* ---------- the wall switch ---------- */
(()=>{
  const sw=document.getElementById("wallSwitch"), hint=document.getElementById("wsHint"), pulse=document.getElementById("wsPulse");
  let used=false;
  sw.addEventListener("click",()=>{
    const on = sw.getAttribute("aria-checked")!=="true";
    sw.setAttribute("aria-checked", on);
    room.classList.toggle("lamp-on", on); room.classList.toggle("lamp-off", !on);
    try{ navigator.vibrate && navigator.vibrate(10); }catch(e){}
    if(!used){ used=true; pulse.classList.add("is-quiet"); hint.classList.add("is-quiet"); }
  });
  window.syncSwitch = ()=>{ sw.setAttribute("aria-checked", true); room.classList.add("lamp-on"); room.classList.remove("lamp-off"); };
})();

/* before / after */
(()=>{ const ba=document.getElementById("ba"); let v=50;
  const set=x=>{ v=Math.max(0,Math.min(100,x)); ba.style.setProperty("--split",v+"%"); ba.setAttribute("aria-valuenow",Math.round(v)); ba.setAttribute("aria-label", lang==="ar"?"نهار وليل":"Daylight and lamplight"); };
  const fromE=e=>{ const r=ba.getBoundingClientRect(); set((e.clientX-r.left)/r.width*100); };
  ba.addEventListener("pointerdown",e=>{ ba.setPointerCapture(e.pointerId); fromE(e); });
  ba.addEventListener("pointermove",e=>{ if(e.buttons) fromE(e); });
  ba.addEventListener("keydown",e=>{ const d={ArrowLeft:-5,ArrowRight:5}[e.key]; if(d){ e.preventDefault(); set(v+d); } });
  set(50); })();

/* boot */
let saved=CONFIG.defaultLight, savedLang="ar"; try{ savedLang=localStorage.getItem("dafi.lang")||"ar"; }catch(e){}
setLang(savedLang==="en"?"en":"ar"); applyLight(saved); syncSwitch(); onScroll();
/* the page opens lit, then the lamp flickers out within the first second so the visitor is invited to switch it back on */
(()=>{ const sw=document.getElementById("wallSwitch");
  const set=on=>{ sw.setAttribute("aria-checked",on); room.classList.toggle("lamp-on",on); room.classList.toggle("lamp-off",!on); };
  if(reduce){ setTimeout(()=>set(false),700); return; }
  room.classList.add("is-flickering");
  [[600,false],[680,true],[760,false],[820,true]].forEach(([t,on])=>setTimeout(()=>set(on),t));
  setTimeout(()=>{ room.classList.remove("is-flickering"); set(false); },950); })();
